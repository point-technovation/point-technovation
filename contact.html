<h2 class="section-title">
Contact Us
</h2>

<form action="contact.php" method="POST" id="contactForm" class="contact-form">

<input
type="text"
name="name"
id="name"
placeholder="Full Name"

type="email"
name="email"
id="email"

type="text"

<input
type="text"
name="company"

<option value="">Select Service</option>

name="message"
id="message"
placeholder="Write Your Requirement..."
